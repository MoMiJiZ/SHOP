<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | 1020 Spectrum</title>
  <meta name="description" content="1020 Spectrum online shop. Choose items, add to cart and order via LINE.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="1020 Spectrum">
  <meta property="og:title" content="Checkout | 1020 Spectrum">
  <meta property="og:image" content="https://www.1020spectrum.com/images/hero.jpg">
  <meta property="og:image:width" content="1500">
  <meta property="og:image:height" content="500">
  <meta property="og:description" content="1020 Spectrum online shop. Choose items, add to cart and order via LINE.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Outfit:wght@300..700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <script>document.write('<link rel="stylesheet" href="css/style.css?t='+Date.now()+'">')</script>
</head>
<body data-page="checkout">
  <header id="site-header" class="site-header"></header>

  <main class="section">
    <div class="container">
      <h1 class="page-title" data-i18n="checkout_title">Checkout</h1>

      <p id="checkout-empty" class="empty" data-i18n-empty hidden>Your cart is empty. <a href="index.html">Continue shopping</a></p>

      <div class="cart-layout">
        <form id="checkout-form" class="checkout-form" novalidate>
          <h2 data-i18n="ship_details">Shipping details</h2>
          <label class="field">
            <span data-i18n="full_name">Full name</span>
            <input class="input" name="name" autocomplete="name">
            <small class="error" data-err="name"></small>
          </label>
          <label class="field">
            <span data-i18n="phone">Phone</span>
            <input class="input" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0812345678">
            <small class="error" data-err="phone"></small>
          </label>
          <label class="field">
            <span data-i18n="address">Shipping address</span>
            <textarea class="input" name="address" rows="3" autocomplete="street-address" placeholder="House no., street, subdistrict, district, province, postal code" data-i18n-ph="address_ph"></textarea>
            <small class="error" data-err="address"></small>
          </label>
          <label class="field">
            <span data-i18n="note">Note (optional)</span>
            <input class="input" name="note">
          </label>

          <h2 data-i18n="pay_method">Payment method</h2>
          <div id="pay-options" class="pay-options"></div>

          <button type="submit" class="btn btn-dark btn-block" data-i18n="place_order">Place order</button>
        </form>

        <aside id="checkout-summary" class="summary">
          <h2 data-i18n="your_order">Your order</h2>
          <div class="sum-items"></div>
          <div class="sum-lines"></div>
        </aside>
      </div>

      <div id="order-result" class="order-result" hidden></div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script>(function(t){["config","products","i18n","app"].forEach(function(n){document.write('<script src="js/'+n+'.js?t='+t+'"><\/script>')})})(Date.now())</script>
</body>
</html>
