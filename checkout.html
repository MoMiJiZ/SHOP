<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | 1020 Spectrum</title>
  <meta name="description" content="ร้านค้าออนไลน์ 1020 Spectrum เลือกสินค้า ใส่ตะกร้า แล้วสั่งซื้อผ่าน LINE ได้เลย">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="1020 Spectrum">
  <meta property="og:title" content="สั่งซื้อสินค้า | 1020 Spectrum">
  <meta property="og:description" content="ร้านค้าออนไลน์ 1020 Spectrum เลือกสินค้า ใส่ตะกร้า แล้วสั่งซื้อผ่าน LINE ได้เลย">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Mr+Dafoe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body data-page="checkout">
  <header id="site-header" class="site-header"></header>

  <main class="section">
    <div class="container">
      <h1 class="page-title">สั่งซื้อสินค้า</h1>

      <p id="checkout-empty" class="empty" hidden>ยังไม่มีสินค้าในตะกร้า <a href="index.html">เลือกซื้อสินค้า</a></p>

      <div class="cart-layout">
        <form id="checkout-form" class="checkout-form" novalidate>
          <h2>ข้อมูลผู้รับ</h2>
          <label class="field">
            <span>ชื่อ-นามสกุล</span>
            <input class="input" name="name" autocomplete="name">
            <small class="error" data-err="name"></small>
          </label>
          <label class="field">
            <span>เบอร์โทร</span>
            <input class="input" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0812345678">
            <small class="error" data-err="phone"></small>
          </label>
          <label class="field">
            <span>ที่อยู่จัดส่ง</span>
            <textarea class="input" name="address" rows="3" autocomplete="street-address" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ จังหวัด รหัสไปรษณีย์"></textarea>
            <small class="error" data-err="address"></small>
          </label>
          <label class="field">
            <span>หมายเหตุ (ถ้ามี)</span>
            <input class="input" name="note">
          </label>

          <h2>วิธีชำระเงิน</h2>
          <div id="pay-options" class="pay-options"></div>

          <button type="submit" class="btn btn-dark btn-block">ยืนยันคำสั่งซื้อ</button>
        </form>

        <aside id="checkout-summary" class="summary">
          <h2>รายการสินค้า</h2>
          <div class="sum-items"></div>
          <div class="sum-lines"></div>
        </aside>
      </div>

      <div id="order-result" class="order-result" hidden></div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/config.js?v=6"></script>
  <script src="js/products.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
